# Fly.io config for the admin Next.js app.
# Required secrets: AUTH_SECRET, ADMIN_EMAIL, ADMIN_TOKEN, RESEND_API_KEY, EMAIL_FROM.

app = "engine-room-admin"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "infra/docker/admin.prod.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  AUTH_TRUST_HOST = "true"
  API_INTERNAL_BASE_URL = "https://engine-room-api.fly.dev"
  API_BASE_URL = "https://engine-room-api.fly.dev"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/sign-in"
    timeout = "5s"
