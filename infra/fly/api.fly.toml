# Fly.io config for the FastAPI API app.
# Create Postgres as a separate Fly Postgres app/volume, then attach it:
#   fly postgres create --name engine-room-db --region sjc --volume-size 10
#   fly postgres attach --app engine-room-api engine-room-db
# Store secrets with `fly secrets set --app engine-room-api ...`.

app = "engine-room-api"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "infra/docker/api.prod.Dockerfile"

[env]
  ENVIRONMENT = "production"
  PORT = "8000"
  OTEL_SERVICE_NAME = "engine-room-api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
