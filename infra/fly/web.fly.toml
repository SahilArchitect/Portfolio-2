# Fly.io config for the public Next.js app.

app = "engine-room-web"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "infra/docker/web.prod.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  API_INTERNAL_BASE_URL = "https://engine-room-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"
