[project]
name = "engine-room-worker"
version = "0.1.0"
description = "APScheduler worker. Pulls Substack posts on a cron, embeds new content, refreshes RAG indexes."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "apscheduler>=3.10.4",
    "engine-room-api",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "markdownify>=0.13.1",
    "openai>=1.50.0",
    "python-slugify>=8.0.4",
    "redis[hiredis]>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
engine-room-api = { workspace = true }
