; funded opening not verified. See original PDF for context.","fit":8,"status":"Speculative","email":"","url":"https://wasp-sweden.org/positions/","source":"Report 2","priority":"Normal"},{"id":"USPI01","name":"Feng Chen — UT Dallas AI Safety Laboratory","country":"United States","focus":"The lab works on uncertainty, unfamiliar/OOD data, bias, unreliable outputs, multi-step-system reliability, hallucination detection, uncertainty in LLM reasoning/execution and outcome-based evaluation. The lab's stated programme explicitly includes OOD detection/generalisation, meta-learning, few-shot learning and domain adaptation.","evidence":"Active research opportunity; Fall-2027 headcount not explicitly confirmed. His lab provides research opportunities to doctoral students, but I found no statement saying “I am recruiting Fall 2027”, so treat availability as unverified until he replies.","approach":"“My M.Tech classifier performed strongly on one encrypted-traffic dataset, but that raised the question I now want to study: when does performance break under traffic/environment shift, and how can uncertainty/OOD methods reveal that before deployment? I want to extend this into reliable deep-learning and agent evaluation.” This is your strongest conceptual match.","fit":10,"status":"Accepting enquiries","email":"feng.chen@utdallas.edu","url":"","source":"US 2027 research","priority":"High"},{"id":"USPI02","name":"Xuyu Wang — FIU","country":"United States","focus":"His current agenda combines trustworthy/generative AI with Wi-Fi, wireless, RFID/mmWave and sensing; his recent research programme includes generative, robust and interpretable wireless intelligence.","evidence":"CONFIRMED Fall 2027 RA positions. He explicitly seeks graduate students for Spring/Fall 2027 in generative/trustworthy AI-driven wireless and sensing.","approach":"Lead with encrypted network traffic, flow statistics and robustness across changing traffic/network environments. Ask whether his Fall-2027 RA could :"United States","focus":"Statistical ML, Bayesian deep learning, probabilistic methods and trustworthy/safe AI, including LLM applications.","evidence":"CONFIRMED Spring/Fall 2027; he explicitly asks prospective students to email him.","approach":"Focus on uncertainty under distribution shift. Explain that static accuracy/F1 in your thesis motivated you to ask how confidence and predictive reliability behave on unseen environments, then connect that to Bayesian deep learning and trustworthy foundation models.","fit":9.6,"status":"Recruiting","email":"hwangml@illinois.edu","url":"","source":"US 2027 research","priority":"High"},{"id":"USPI06","name":"Bo Hui — Purdue University","country":"United States","focus":"Agentic-AI security, privacy-preserving LLM post-training and generative-AI privacy; broader work includes trustworthy generative AI and attacks/failures of modern models.","evidence":"CONFIRMED: recruiting 2–3 PhD students for Spring/Fall 2027.","approach":"Pitch yourself as an evaluation/reliability candidate, not a security expert: systematic failure evaluation of LLM/agent pipelines under adversarial or shifted inputs, uncertainty signals and reproducible red-team-style experimentation. Ask which Purdue doctoral programme he expects Fall-2027 students to enter.","fit":8.9,"status":"Recruiting","email":"bo.hui@purdue.edu","url":"","source":"US 2027 research","priority":"High"},{"id":"USPI07","name":"Adel Javanmard — USC Marshall","country":"United States","focus":"Theoretical ML, adversarial robustness and distributionally adversarial learning; his research includes the robustness-versus-standard-accuracy problem and distributional robustness.","evidence":"ACTIVE current prospective-PhD invitation, page updated 27 Sep 2026; not explicitly labelled “Fall 2027”.","approach":"Write only if you can credibly discuss probability/statistics/optimisation. Frame your desire to move from purely empirical traffic-classification metrics toward principled robustness under distributional misspecification. Avoid claiming theoretical depth you do not have.","fit":9.3,"status":"Accepting enquiries","email":"ajavanma@usc.edu","url":"","source":"US 2027 research","priority":"Normal"},{"id":"USPI08","name":"Maria Antoniak — CU Boulder","country":"United States","focus":"NLP with strong interest in evaluation and probing of models/datasets, including culturally/socially grounded real-world NLP.","evidence":"CONFIRMED active Fall-2027 recruitment through CU's departmental recruiting page.","approach":"Position yourself around evaluation validity: how benchmark scores fail to predict behaviour under real deployment distributions, with potential extension to LLM evaluation.","fit":8.2,"status":"Recruiting","email":"","url":"","source":"US 2027 research","priority":"Normal"},{"id":"USPI09","name":"Mark Zhao — CU Boulder BASIL","country":"United States","focus":"Systems for training/deploying ML, including scalability, efficiency and security across the ML pipeline.","evidence":"CONFIRMED active Fall-2027 recruitment through CU.","approach":"Emphasise reliable practical ML systems, your FastAPI/backend/testing experience and reproducible experimentation. This is a good place to make your software-engineering background an asset rather than an unrelated line on the CV.","fit":8,"status":"Recruiting","email":"","url":"","source":"US 2027 research","priority":"Normal"},{"id":"USPI11","name":"Kai-Wei Chang — UCLA","country":"United States","focus":"Trustworthy AI, foundation models, agent-oriented work and robust language/vision-language alignment.","evidence":"ACTIVE, with a current lab statement that it is looking for PhD students/postdocs interested in foundation models, scientific agents and trustworthy AI; not independently confirmed specifically for the Fall-2027 cohort.","approach":"Lead with reliable LLM/agent evaluation under changing task distributions, uncertainty and failure detection. Treat UCLA as a reach, not a core application.", function notify(s){let el=$('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(topToastTimer);topToastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
function openDetail(id){let a=get(id);if(!a)return;currentId=id;let p=prog(id),op=a.kind==='opportunity';$('#modal').classList.remove('hidden');$('#modal').classList.add('overlay');document.body.style.overflow='hidden';const related=op?groups.people().filter(c=>(a.contact||'').toLowerCase().split(/[;/,&]/).some(z=>z.trim().length>5&&c.name.toLowerCase().includes(z.trim().toLowerCase()))).slice(0,4):groups.opps().filter(o=>(o.contact||'').toLowerCase().split(/[;/,&]/).some(z=>z.trim().length>5&&a.name.toLowerCase().includes(z.trim().toLowerCase()))).slice(0,5);$('#modal').innerHTML=`<div class="drawer"><div class="drawer-head"><div><span class="eyebrow">${op?'Opportunity':'Professor / lab'} · ${esc(a.source||'Custom')}</span><h2>${esc(a.name)}</h2><div class="row">${tag(a.country)}${tag('Fit '+fmtFit(a)+'/10','blue')}${tag(a.status||'Lead',a.status==='Open'?'green':'')}${a.conflict?tag('Verification needed','orange'):''}</div></div><button class="iconx" data-close aria-label="Close">×</button></div><div class="drawer-body"><div class="grid2"><div class="field"><label>My stage</label><select id="p-stage">${stages.map(s=>`<option ${s===(p.stage||'Not started')?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select id="p-priority"><option ${p.priority==='Normal'?'selected':''}>Normal</option><option ${p.priority==='High'?'selected':''}>High</option><option ${p.priority==='Critical'?'selected':''}>Critical</option></select></div></div><div class="grid2"><div class="field"><label>${op?'Override deadline (optional)':'Last contact date'}</label><input type="date" id="p-deadline" value="${attr(op?(p.deadline||a.deadline||''):(p.lastContact||''))}"></div><div class="field"><label>Next follow-up / reminder date</label><div class="row" style="flex-wrap:nowrap"><input type="date" style="flex:1;min-width:80px" id="p-nextDate" value="${attr(p.nextDate||'')}"><button class="mini" data-week title="Follow up in 7 days">+7d</button></div></div></div><div class="field"><label>Next concrete action</label><input id="p-nextAction" value="${attr(p.nextAction||a.next||'')}" placeholder="e.g. Tailor motivation letter and apply"></div><div class="field"><label>My notes / application reference / email reply</label><textarea id="p-note" rows="5" placeholder="Keep everything here so you don't need to hunt through emails">${esc(p.note||'')}</textarea></div><div class="grid2"><div class="field"><label>Official details last checked on</label><div class="row" style="flex-wrap:nowrap"><input type="date" style="flex:1;min-width:80px" id="p-verifiedOn" value="${attr(p.verifiedOn||'')}"><button class="mini" data-checktoday>Today</button></div></div><div class="field"><label>Email / applicant reference (optional)</label><input id="p-reference" value="${attr(p.reference||'')}" placeholder="Portal application ID"></div></div>${a.source==='Custom'?`<div class="detail-box"><h4>Edit your custom lead</h4><div class="stack"><div class="field"><label>Title / name</label><input data-custom="name" value="${attr(a.name)}"></div><div class="field"><label>Institution / lab</label><input data-custom="institution" value="${attr(a.institution||'')}"></div><div class="field"><label>Contact email</label><input type="email" data-custom="email" value="${attr(a.email||'')}"></div><div class="field"><label>Official link</label><input type="url" data-custom="url" value="${attr(a.url||'')}"></div><div class="field"><label>Funding / research fit notes</label><input data-custom="why" value="${attr(a.why||'')}"></div></div></div>`:''}<div class="detail-box"><h4>${op?'Application information from report':'Research fit & outreach information'}</h4><p><strong>Country:</strong> ${esc(a.country)} ${a.institution?' · '+esc(a.institution):''}</p>${a.contact?`<p><strong>Contact:</strong> ${esc(a.contact)}</p>`:''}${a.email?`<p><strong>Email:</strong> <a href="mailto:${attr(a.email)}">${esc(a.email)}</a> <button class="mini" data-copy="${attr(a.email)}">Copy</button></p>`:''}${op?`<p><strong>Reported deadline:</strong> ${esc(a.deadlineText||'Not specified')}</p><p><strong>Reported funding:</strong> ${esc(a.funding||'Unclear')}</p><p><strong>Profile likelihood:</strong> ${esc(a.likelihood||'Not assessed')}</p>`:''}<p><strong>Why it fits:</strong> ${esc(a.why||a.focus||'')}</p>${a.evidence?`<p><strong>Background:</strong> ${esc(a.evidence)}</p>`:''}${a.approach?`<p><strong>Recommended contact approach:</strong> ${esc(a.approach)}</p>`:''}${a.conflict?`<p style="color:#94550e"><strong>Discrepancy / check:</strong> ${esc(a.conflict)}</p>`:''}<p><strong>Evidence status:</strong> ${esc(a.confidence||a.source+' report, not live checked')}</p>${a.url?`<p><a href="${attr(a.url)}" target="_blank" rel="noopener noreferrer">↗ Open source / application page</a></p>`:'<p class="smallnote">No reliable direct application link extracted. Search the official institution site manually.</p>'}</div>${op?`<div class="detail-box"><h4>Application checklist</h4><div class="checks">${[['cv','Academic CV'],['motivation','Motivation letter'],['transcripts','Transcripts / degree'],['proposal','Research proposal'],['refs','Referees / LOR'],['submitted','Portal submitted']].map(([key,label])=>`<label><input type="checkbox" data-check="${key}" ${p.checks?.[key]?'checked':''}> ${label}</label>`).join('')}</div></div>`:''}${futurePanel(a)}${related.length?`<div class="detail-box"><h4>${op?'Related people':'Related projects'}</h4><div class="stack">${related.map(c=>`<button class="mini" style="text-align:left" data-related="${attr(c.id)}">${esc(short(c.name,85))} ↗</button>`).join('')}</div></div>`:''}<p class="smallnote">To edit the original source URL or title, create your own updated lead. The research snapshot itself stays unchanged.</p></div><div class="drawer-foot"><button class="btn" data-pin>${p.star?'★ Unpin':'☆ Pin'}</button>${a.url?`<a class="btn" href="${attr(a.url)}" target="_blank" rel="noopener noreferrer">↗ Source</a>`:''}${a.source==='Custom'?'<button class="btn danger" data-delete>Delete</button>':''}<button class="btn primary" data-close>Done</button></div></div>`;$('#p-stage').focus()}
function closeDetail(){let modal=$('#modal');modal.classList.add('hidden');modal.classList.remove('overlay');modal.innerHTML='';document.body.style.overflow='';currentId='';render()}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportBackup(){download('phd-atlas-backup-'+dateToday()+'.json',JSON.stringify({format:'phd-atlas-v3',savedAt:new Date().toISOString(),state},null,2),'application/json');notify('Backup exported')}
function csv(){const fields=['Type','Name','Country','Institution','Research fit','Status in report','Deadline','My stage','My priority','Next action','Follow-up date','Verified on','Email','Source','URL','Notes'];const v=a=>[a.kind==='opportunity'?'Opportunity':'Professor',a.name,a.country,a.institution||a.evidence||'',a.fit,a.status,prog(a.id).deadline||a.deadline||'',prog(a.id).stage||'Not started',prog(a.id).priority||a.priority,prog(a.id).nextAction||'',prog(a.id).nextDate||'',prog(a.id).verifiedOn||'',a.email||'',a.source,a.url||'',prog(a.id).note||''];const safe=s=>{s=String(s??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('phd-atlas-leads-'+dateToday()+'.csv','\uFEFF'+[fields,...all().map(v)].map(r=>r.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV exported')}
function addLead(){let kind=tab==='people'?'contact':'opportunity';let name=prompt('New '+(kind==='contact'?'professor or lab':'opportunity')+' name:');if(!name||!name.trim())return;let country=prompt('Country:','');let item={id:'U'+Date.now(),kind,name:name.trim(),country:(country||'Not set').trim(),institution:'',status:'Watchlist',deadline:'',deadlineText:'',funding:'Unconfirmed',fit:null,likelihood:'Not assessed',why:'User-added lead; fill in notes',next:'Review lead and set next step',url:'',contact:'',email:'',source:'Custom',priority:'Normal'};state.custom.push(item);save();showTab(kind==='contact'?'people':'opps');openDetail(item.id)}
// Delegate static buttons and card buttons.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){showTab(nav.dataset.tab);return}let el=e.target.closest('[data-tabgo]');if(el){showTab(el.dataset.tabgo);return}el=e.target.closest('[data-open]');if(el){openDetail(el.dataset.open);return}el=e.target.closest('[data-related]');if(el){openDetail(el.dataset.related);return}el=e.target.closest('[data-star]');if(el){mutate(el.dataset.star,'star',!prog(el.dataset.star).star);render();return}el=e.target.closest('[data-quick]');if(el){filter.quick=el.dataset.quick;render();return}if(e.target.closest('[data-filterstar]')){filter.star=!filter.star;render();return}el=e.target.closest('[data-action]');if(el){let a=el.dataset.action;if(a==='people'||a==='opps'){filter.quick='All';showTab(a)}else if(a==='urgent'){filter.quick='Urgent';showTab('opps')}else if(a==='progress'){filter.quick='Progress';showTab('opps')}else if(a==='applied'){filter.quick='Applied';showTab('opps')}return}if(e.target.closest('#exportTop,#backup')){exportBackup();return}if(e.target.closest('#addNew')){addLead();return}if(e.target.closest('#import')){$('#importFile').click();return}if(e.target.closest('#exportcsv')){csv();return}if(e.target.closest('#reset')){if(confirm('Erase all saved stages, notes, follow-up dates and custom leads? Export a backup first if needed.')){state={progress:{},custom:[],reviewedAt:null};save();render();notify('Progress reset')}return}if(e.target.closest('#clearfilters')){filter={q:'',country:'All',stage:'All',quick:'All',sort:'due',source:'All',star:false};render();return}if(!currentId)return;if(e.target.closest('[data-checktoday]')){let d=dateToday();$('#p-verifiedOn').value=d;mutate(currentId,'verifiedOn',d);notify('Official details marked checked today');return}if(e.target.closest('[data-week]')){let d=new Date();d.setDate(d.getDate()+7);let ds=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('#p-nextDate').value=ds;mutate(currentId,'nextDate',ds);notify('Follow-up set for 7 days');return}if(e.target.closest('[data-close]')){closeDetail();return}if(e.target.closest('[data-pin]')){mutate(currentId,'star',!prog(currentId).star);openDetail(currentId);return}if(e.target.closest('[data-delete]')){if(confirm('Delete this custom lead?')){state.custom=state.custom.filter(x=>x.id!==currentId);delete state.progress[currentId];save();closeDetail();notify('Deleted custom lead')}return}el=e.target.closest('[data-copy]');if(el){let value=el.dataset.copy;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(()=>notify('Email copied')).catch(()=>notify('Copy the email from the field'));else notify('Copy the email from the field');return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter.q=e.target.value;let caret=e.target.selectionStart;let active=document.activeElement;render();let input=$('#search');input?.focus();input?.setSelectionRange(caret,caret);return}if(!currentId)return;if(e.target.matches('[data-custom]')){let x=get(currentId);if(x&&x.source==='Custom'){x[e.target.dataset.custom]=e.target.value;save();}return}const key=({'p-nextAction':'nextAction','p-note':'note','p-reference':'reference'})[e.target.id];if(key)mutate(currentId,key,e.target.value)});
document.addEventListener('change',e=>{let id=e.target.id;if(['country','stage','sort','source'].includes(id)){filter[id]=e.target.value;render();return}if(id==='importFile'){let file=e.target.files[0];if(!file)return;file.text().then(text=>{let b=JSON.parse(text);if(b.format!=='phd-atlas-v3'||!b.state||typeof b.state.progress!=='object'||!Array.isArray(b.state.custom))throw Error('Not a PhD Atlas backup');if(!confirm('Replace your current saved changes with this backup?'))return;state=b.state;save();render();notify('Backup imported')}).catch(err=>alert('Could not import: '+err.message));e.target.value='';return}if(!currentId)return;let dict={'p-stage':'stage','p-priority':'priority','p-nextDate':'nextDate','p-verifiedOn':'verifiedOn'};if(dict[id]){mutate(currentId,dict[id],e.target.value);if(id==='p-stage')notify('Stage saved');return}if(id==='p-deadline'){mutate(currentId,get(currentId).kind==='opportunity'?'deadline':'lastContact',e.target.value);return}if(e.target.matches('[data-future]')){let key=e.target.dataset.future;let p=prog(currentId);let obj={...(p.futureScores||{})};obj[key]=e.target.value;mutate(currentId,'futureScores',obj);openDetail(currentId);return}if(e.target.matches('[data-check]')){let p=prog(currentId);mutate(currentId,'checks',{...(p.checks||{}),[e.target.dataset.check]:e.target.checked});return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentId)closeDetail()});load();</script></body></html>
