name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, unit tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: site
          POSTGRES_PASSWORD: site
          POSTGRES_DB: site_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U site -d site_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://site:site@localhost:5432/site_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # Throwaway values: CI never talks to GitHub OAuth; e2e creates a session in the test DB.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AUTH_GITHUB_ID: ci
      AUTH_GITHUB_SECRET: ci
      ADMIN_ALLOWED_IDENTITY: github:1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Trident regression tests
        run: pnpm --filter @bysahil/web test:trident
      - name: Install Playwright browser
        run: pnpm --filter @bysahil/web exec playwright install --with-deps chromium
      - name: E2E (prepare DB, build, test)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
